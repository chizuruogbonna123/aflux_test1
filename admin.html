<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>AFLUX Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div id="gate" class="gate"></div>
<div class="shell" id="shell" hidden>
  <aside class="side" id="side">
    <a class="brand" href="#dashboard">AFLUX</a>
    <nav id="menu" aria-label="Admin"></nav>
    <button class="out" id="logout">Sign out</button>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="main">
    <header class="top">
      <button class="burger" id="burger" aria-label="Open menu"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 7h18M3 12h18M3 17h18"/></svg></button>
      <div class="hi"><h1 id="hello"></h1><p>Here’s what’s happening with your store.</p></div>
      <div class="who"><a class="link" href="index.html">View website</a><span class="av" id="av"></span></div>
    </header>
    <main id="view" tabindex="-1"></main>
  </div>
</div>
<div id="toast" class="toast" role="status"></div>
<script src="js/supabase-lib.js"></script>
<script src="js/supabase.js"></script>
<script src="js/data.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
